---
- name: Load software list
  ansible.builtin.set_fact:
    software_list: "{{ lookup('file', playbook_dir + '/../software_list.json') | from_json }}"

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ item.value.apt }}"
    state: present
    update_cache: true
  loop: "{{ software_list | dict2items }}"
  changed_when: false
  when:
    - item.value.apt is defined
    - item.value.apt != 'custom'

- name: Ensure ~/bin directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/bin"
    state: directory
    mode: '0755'

- name: Ensure unzip is installed for oh-my-posh
  become: true
  ansible.builtin.apt:
    name: unzip
    state: present
  when: install_oh_my_posh | default(true)

- name: Install oh-my-posh via command
  ansible.builtin.command: "{{ software_list['oh-my-posh'].custom_install }}"
  args:
    creates: "{{ ansible_env.HOME }}/bin/oh-my-posh"
  when:
    - software_list['oh-my-posh'].custom_install is defined
    - oh_my_posh_method | default('command') == 'command'
    - install_oh_my_posh | default(true)

- name: Install oh-my-posh via get_url
  ansible.builtin.get_url:
    url: "https://github.com/JanDeDobbeleer/oh-my-posh/releases/latest/download/posh-linux-amd64"
    dest: /usr/local/bin/oh-my-posh
    mode: '0755'
    checksum: "{{ oh_my_posh_checksum | default(omit) }}"
  when:
    - oh_my_posh_method | default('command') == 'get_url'
    - install_oh_my_posh | default(true)

- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: 'https://github.com/setuc/dotfiles.git'
    dest: "{{ ansible_env.HOME }}/dotfiles"
    version: d144c11245fb0418a7ead33c640c575ef83e5420
    update: true

- name: Stow configuration directories
  ansible.builtin.command:
    cmd: "stow --restow --dir={{ ansible_env.HOME }}/dotfiles --target={{ ansible_env.HOME }} {{ item }}"
  loop:
    - bash
    - bin
    - oh-my-posh
    - vim
  changed_when: false

- name: Copy alias files
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/dotfiles/bash/aliases/"
    dest: "{{ ansible_env.HOME }}/aliases/"
    owner: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    mode: '0644'
    remote_src: true

- name: Copy function files
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/dotfiles/bash/functions/"
    dest: "{{ ansible_env.HOME }}/functions/"
    owner: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    mode: '0644'
    remote_src: true
