---
# requirements.yml - Ansible Galaxy requirements
#
# This file defines the Ansible collections and roles required for Azure VM automation.
# Install these requirements using:
#   ansible-galaxy collection install -r requirements.yml
#   ansible-galaxy role install -r requirements.yml

collections:
  # Azure collection for managing Azure resources
  - name: azure.azcollection
    version: ">=1.19.0"
    
  # Community general collection for additional modules
  - name: community.general
    version: ">=7.0.0"
    
  # POSIX collection for system tasks
  - name: ansible.posix
    version: ">=1.5.0"
    
  # Windows collection (if managing Windows VMs)
  - name: ansible.windows
    version: ">=1.14.0"

roles:
