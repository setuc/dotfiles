---
- name: Setup local environment
  hosts: localhost
  gather_facts: true
  vars:
    software_list: "{{ lookup('file', 'software_list.json') | from_json }}"
    dotfiles_dir: "{{ playbook_dir }}"
  tasks:
    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        name: "{{ item.value.apt }}"
        state: present
      when:
        - item.value.apt is defined
        - item.value.apt != 'custom'
      loop: "{{ software_list | dict2items }}"

    - name: Ensure ~/bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/bin"
        state: directory
        mode: "0755"

    - name: Run custom install commands
      ansible.builtin.shell: "{{ item.value.custom_install }}"
      args:
        executable: /bin/bash
      when:
        - item.value.custom_install is defined
        - item.value.apt == 'custom'
      loop: "{{ software_list | dict2items }}"
      changed_when: false
    - name: Ensure Stow is installed
      become: true
      ansible.builtin.apt:
        name: stow
        state: present

    - name: Check if ~/.bashrc exists and is not a symlink
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.bashrc"
        follow: false
      register: bashrc_stat

    - name: Backup existing ~/.bashrc
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.bashrc"
        dest: "{{ ansible_env.HOME }}/.bashrc.backup"
        remote_src: true
      when:
        - bashrc_stat.stat.exists
        - not bashrc_stat.stat.islnk

    - name: Remove ~/.bashrc to avoid stow conflicts
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.bashrc"
        state: absent
      when:
        - bashrc_stat.stat.exists
        - not bashrc_stat.stat.islnk

    - name: Stow dotfiles
      ansible.builtin.shell: |
        stow --verbose --restow --dir={{ dotfiles_dir }} --target=$HOME bash bin oh-my-posh
      args:
        chdir: "{{ dotfiles_dir }}"
        executable: /bin/bash
      changed_when: false
