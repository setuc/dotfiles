---
- name: Setup local environment
  hosts: localhost
  gather_facts: true
  vars:
    software_list: "{{ lookup('file', 'software_list.json') | from_json }}"
    dotfiles_dir: "{{ playbook_dir }}"
  tasks:
    - name: Install apt packages
      become: true
      ansible.builtin.apt:
        name: "{{ item.value.apt }}"
        state: present
      when:
        - item.value.apt is defined
        - item.value.apt != 'custom'
      loop: "{{ software_list | dict2items }}"

    - name: Install jq for helper scripts
      become: true
      ansible.builtin.apt:
        name: jq
        state: present

    - name: Check for Azure CLI
      ansible.builtin.command: az --version
      register: azure_cli_check
      ignore_errors: true

    - name: Install Azure CLI
      become: true
      ansible.builtin.shell: curl -sL https://aka.ms/InstallAzureCLIDeb | bash
      args:
        executable: /bin/bash
      when: azure_cli_check.rc != 0

    - name: Install available Azure system packages
      become: true
      ansible.builtin.apt:
        name:
          - python3-azure
          - python3-msrest
          - python3-msrestazure
          - python3-venv
        state: present
        
    - name: Create Azure automation virtual environment
      ansible.builtin.command: python3 -m venv {{ ansible_env.HOME }}/.azvm-venv
      args:
        creates: "{{ ansible_env.HOME }}/.azvm-venv"
        
    - name: Install Azure management packages in venv
      ansible.builtin.pip:
        name:
          - azure-mgmt-compute
          - azure-mgmt-network
          - azure-mgmt-resource
          - azure-common
          - azure-cli-core
        virtualenv: "{{ ansible_env.HOME }}/.azvm-venv"
        
    - name: Install Python requirements (non-Azure)
      become: true
      ansible.builtin.pip:
        requirements: "{{ dotfiles_dir }}/requirements.txt"
        extra_args: --break-system-packages
        
    - name: Install Azure Ansible collection
      ansible.builtin.shell: ansible-galaxy collection install azure.azcollection
      args:
        creates: "{{ ansible_env.HOME }}/.ansible/collections/ansible_collections/azure/azcollection"

    - name: Ensure ~/bin directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/bin"
        state: directory
        mode: "0755"

    - name: Run custom install commands
      ansible.builtin.shell: "{{ item.value.custom_install }}"
      args:
        executable: /bin/bash
      when:
        - item.value.custom_install is defined
        - item.value.apt == 'custom'
      loop: "{{ software_list | dict2items }}"
      changed_when: false
    - name: Ensure Stow is installed
      become: true
      ansible.builtin.apt:
        name: stow
        state: present

    - name: Check if ~/.bashrc exists and is not a symlink
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.bashrc"
        follow: false
      register: bashrc_stat

    - name: Backup existing ~/.bashrc
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/.bashrc"
        dest: "{{ ansible_env.HOME }}/.bashrc.backup"
        remote_src: true
      when:
        - bashrc_stat.stat.exists
        - not bashrc_stat.stat.islnk

    - name: Remove ~/.bashrc to avoid stow conflicts
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.bashrc"
        state: absent
      when:
        - bashrc_stat.stat.exists
        - not bashrc_stat.stat.islnk

    - name: Stow dotfiles
      ansible.builtin.shell: |
        stow --verbose --restow --dir={{ dotfiles_dir }} --target=$HOME bash bin oh-my-posh
      args:
        chdir: "{{ dotfiles_dir }}"
        executable: /bin/bash
      changed_when: false

    - name: Configure git user.name
      ansible.builtin.git_config:
        name: user.name
        scope: global
        value: "{{ git_user_name | default('Your Name') }}"

    - name: Configure git user.email
      ansible.builtin.git_config:
        name: user.email
        scope: global
        value: "{{ git_user_email | default('your.email@example.com') }}"

    - name: Install getnf script
      ansible.builtin.shell: |
        curl -fsSL https://raw.githubusercontent.com/getnf/getnf/main/install.sh | bash
      args:
        executable: /bin/bash
        creates: "{{ ansible_env.HOME }}/.local/bin/getnf"

    - name: Install Iosevka Term Nerd Font
      ansible.builtin.command: "{{ ansible_env.HOME }}/.local/bin/getnf -i IosevkaTerm"
      args:
        creates: "{{ ansible_env.HOME }}/.local/share/fonts/IosevkaTerm"
